name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (renderer + electron + tests)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck (electron build config)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Unit tests
        run: npm run test
