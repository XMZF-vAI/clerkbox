name: Fix release notes

# 一次性运维：用 Actions 的 contents:write 权限修正已发布 Release 的正文。
# 触发：推送 .github/release-notes-fix/ 下的文件；跑完即删除。
on:
  push:
    paths:
      - '.github/release-notes-fix/**'
      - '.github/workflows/fix-release-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch release bodies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v3.5.0 v3.5.1 v2.5.0; do
            f=".github/release-notes-fix/${tag}.md"
            if [ ! -f "$f" ]; then
              echo "skip ${tag}: no file"
              continue
            fi
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F body=@"$f" --jq '.tag_name + " patched"'
          done
