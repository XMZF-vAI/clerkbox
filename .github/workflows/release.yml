name: Release

on:
  push:
    tags: ['v*']
  # 手动触发：仅构建并归档 artifact，不发 Release（打 tag 前的验证通道）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            # Windows NSIS 安装包
            build_cmd: npm run build
          - name: macos
            os: macos-latest
            # dmg 双架构（Intel + Apple Silicon）
            build_cmd: npm run build:mac
          - name: linux
            # ubuntu-22.04 平衡 glibc 兼容面（覆盖主流发行版）
            os: ubuntu-22.04
            build_cmd: npm run build:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Linux 无 node-pty 预编译包，此处触发源码编译（runner 自带 gcc/build-essential）
        run: npm ci

      - name: Run unit tests
        # 测试不过则不出包：防止带病构建流向 Release
        run: npm run test

      - name: Build installer
        run: ${{ matrix.build_cmd }}
        env:
          # mac runner 无签名证书，禁止 electron-builder 自动发现签名身份（保持不签名构建）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clerkbox-${{ matrix.name }}
          path: |
            release-out/*.exe
            release-out/*.dmg
            release-out/*.AppImage
            release-out/*.blockmap
            release-out/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 发布说明以版本库里的 .release-notes.md 为准（中文发布文档）。checkout 到
      # tag 对应的那一份，因此重打 tag 时文档会随 commit 一起走。
      # 缺文件时回退 gh 的 --generate-notes，保证发版流程不因缺文档而卡住。
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        # 用 gh CLI 集中上传，规避 electron-builder v26 并发上传产生多个草稿 Release 的 bug
        # -R 显式指定仓库：本 job 的 checkout 放在 source/ 下，git remote 不可靠
        # TAG / SHA 经 env 显式注入：曾因依赖 GITHUB_REF 拿到空串，让 gh 造出一个
        # untagged-<sha> 的孤儿 release 且 job 仍报绿。空值一律 fail fast。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO=XMZF-vAI/clerkbox
          if [ -z "$TAG" ]; then
            echo "::error::TAG 为空（github.ref_name 未注入），拒绝创建 untagged release"
            exit 1
          fi
          NOTES_ARGS=(--generate-notes)
          if [ -f source/.release-notes.md ]; then
            NOTES_ARGS=(--notes-file source/.release-notes.md)
          fi
          # 重跑幂等：同一个 tag 重发时已存在 release，此时只改说明并覆盖资产，
          # 而不是让 gh release create 撞「tag already exists」把整条流水线判红。
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" "${NOTES_ARGS[@]}"
            gh release upload "$TAG" -R "$REPO" --clobber dist/*
          else
            gh release create "$TAG" -R "$REPO" --verify-tag "${NOTES_ARGS[@]}" dist/*
          fi
          # 清理同一 commit 上残留的 untagged release（tag 解析失败时的副产物）
          SHORT="${SHA:0:20}"
          for id in $(gh api "repos/$REPO/releases" --paginate \
              --jq ".[] | select(.tag_name == \"untagged-$SHORT\") | .id"); do
            echo "清理残留 untagged release: $id"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
