name: Release

on:
  push:
    tags: ['v*']
  # 手动触发：仅构建并归档 artifact，不发 Release（打 tag 前的验证通道）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            # Windows NSIS 安装包
            build_cmd: npm run build
          - name: macos
            os: macos-latest
            # dmg 双架构（Intel + Apple Silicon）
            build_cmd: npm run build:mac
          - name: linux
            # ubuntu-22.04 平衡 glibc 兼容面（覆盖主流发行版）
            os: ubuntu-22.04
            build_cmd: npm run build:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Linux 无 node-pty 预编译包，此处触发源码编译（runner 自带 gcc/build-essential）
        run: npm ci

      - name: Run unit tests
        # 测试不过则不出包：防止带病构建流向 Release
        run: npm run test

      - name: Build installer
        run: ${{ matrix.build_cmd }}
        env:
          # mac runner 无签名证书，禁止 electron-builder 自动发现签名身份（保持不签名构建）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clerkbox-${{ matrix.name }}
          path: |
            release-out/*.exe
            release-out/*.dmg
            release-out/*.AppImage
            release-out/*.blockmap
            release-out/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 发布说明以版本库里的 .release-notes.md 为准（中文发布文档）。checkout 到
      # tag 对应的那一份，因此重打 tag 时文档会随 commit 一起走。
      # 缺文件时回退 gh 的 --generate-notes，保证发版流程不因缺文档而卡住。
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        # 不用 gh release create：它在「工作目录没有 .git + 显式传 tag 名」这个组合下
        # 会建成 untagged-<sha> 的孤儿 release（tag 传对了也照样），且 job 仍报绿——
        # 实测连打三�� tag 才定位到。REST API 的 tag_name 是必填字段，没有解析歧义。
        # 资产上传仍走 gh release upload：它只上传、不创建，不受该问题影响。
        # -R 显式指定仓库：本 job 的 checkout 放在 source/ 下，git remote 不可靠
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO=XMZF-vAI/clerkbox
          if [ -z "$TAG" ]; then
            echo "::error::TAG 为空（github.ref_name 未注入）"
            exit 1
          fi
          # 取 tag 对应的那份中文发布说明；annotated tag 未必在本地 ref 里，退回 HEAD
          if ! git -C source show "$TAG:.release-notes.md" > notes.md 2>/dev/null; then
            if ! git -C source show "HEAD:.release-notes.md" > notes.md 2>/dev/null; then
              rm -f notes.md
            fi
          fi
          if [ -f notes.md ]; then
            echo "notes: 使用仓库内 .release-notes.md（$(wc -c < notes.md) bytes）"
          else
            echo "notes: 仓库内没有 .release-notes.md，回退 generate_release_notes"
          fi

          # 存在性判断必须用 gh release view：gh api 在 404 时会把 {"message":"Not Found"}
          # 打到 stdout，$( ) 取到的是那串 JSON 而非空值，会误判成「已存在」而走进
          # PATCH 分支，拿一个 JSON 当 release id 去拼端点。
          EXISTING=$(gh release view "$TAG" -R "$REPO" --json id --jq '.id' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "release $TAG 已存在（id=$EXISTING），只更新说明"
            if [ -f notes.md ]; then
              gh api -X PATCH "repos/$REPO/releases/$EXISTING" -F body=@notes.md --jq '.html_url'
            fi
          else
            echo "创建 release $TAG"
            if [ -f notes.md ]; then
              gh api -X POST "repos/$REPO/releases" -f tag_name="$TAG" -f name="$TAG" \
                -F draft=false -F prerelease=false -F body=@notes.md --jq '.html_url'
            else
              gh api -X POST "repos/$REPO/releases" -f tag_name="$TAG" -f name="$TAG" \
                -F draft=false -F prerelease=false -F generate_release_notes=true --jq '.html_url'
            fi
          fi

          gh release upload "$TAG" -R "$REPO" --clobber dist/*

          # 收尾校验：建错 tag（曾经栽在 untagged 上）必须当场炸，不能等发版后才发现
          ACTUAL=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.tag_name')
          if [ "$ACTUAL" != "$TAG" ]; then
            echo "::error::tag_name 不符，期望 $TAG 实得 $ACTUAL"
            exit 1
          fi
          echo "OK: release $ACTUAL 就绪"
